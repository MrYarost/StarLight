<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex-Strike — Сообщество</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #1a1a1a; border-radius: 12px; margin-bottom: 24px; border: 1px solid #2a2a2a; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-left h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .header-links { display: flex; gap: 18px; font-size: 14px; }
        .header-links a { color: #aaa; text-decoration: none; transition: color 0.2s; }
        .header-links a:hover { color: #fff; }
        .sync-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; background: #0d0d0d; padding: 6px 14px; border-radius: 20px; border: 1px solid #2a2a2a; }
        .sync-status .dot { width: 10px; height: 10px; border-radius: 50%; background: #00b894; }
        .sync-status .dot.syncing { background: #fdcb6e; animation: pulse 0.8s infinite; }
        .sync-status .dot.error { background: #e74c3c; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .panel { background: #1a1a1a; border-radius: 12px; padding: 24px; border: 1px solid #2a2a2a; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .panel-header h2 { font-size: 20px; color: #fff; }
        .panel-header .badge { background: #2a2a2a; padding: 4px 12px; border-radius: 20px; font-size: 13px; color: #888; }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #6c5ce7; color: #fff; }
        .btn-primary:hover { background: #7c6cf7; transform: scale(1.02); }
        .btn-outline { background: transparent; color: #888; border: 1px solid #2a2a2a; }
        .btn-outline:hover { background: #252525; color: #fff; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .list { display: flex; flex-direction: column; gap: 12px; }
        .list-item { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; transition: border-color 0.2s; }
        .list-item:hover { border-color: #3a3a3a; }
        .list-item .info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
        .list-item .info .title { font-size: 18px; font-weight: 700; color: #fff; }
        .list-item .info .details { font-size: 14px; color: #888; display: flex; flex-wrap: wrap; gap: 16px; }
        .list-item .info .desc { font-size: 13px; color: #666; margin-top: 4px; }
        .list-item .actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .empty-state { text-align: center; padding: 40px 20px; color: #666; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 16px; background: #0d0d0d; border: 1px solid #2a2a2a;
            border-radius: 8px; color: #fff; font-size: 14px; transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #6c5ce7; }
        .form-group .hint { font-size: 12px; color: #666; margin-top: 4px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a1a; border-radius: 16px; padding: 32px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; border: 1px solid #2a2a2a; }
        .modal-content h2 { color: #fff; margin-bottom: 20px; font-size: 24px; }
        .modal-content .close-btn { float: right; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .modal-content .close-btn:hover { color: #fff; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }

        .toast { position: fixed; bottom: 30px; right: 30px; padding: 14px 24px; border-radius: 10px; color: #fff; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #00b894; }
        .toast.error { background: #e74c3c; }

        @media (max-width: 600px) {
            .list-item { flex-direction: column; align-items: stretch; }
            .header { flex-direction: column; align-items: stretch; }
            .header-left { flex-direction: column; align-items: flex-start; gap: 8px; }
            .panel { padding: 16px; }
            .sync-status { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>Vortex-Strike: Community</h1>
                <div class="header-links">
                    <a href="https://mryarost.github.io/StarLight/vortex_rules.html" target="_blank">Правила</a>
                    <a href="https://mryarost.github.io/StarLight/vortex_download" target="_blank">Скачать</a>
                    <a href="https://mryarost.github.io/StarLight/vortex.html" target="_blank">Сообщество</a>
                </div>
            </div>
            <div class="sync-status" id="syncStatus">
                <span class="dot" id="syncDot"></span>
                <span id="syncText">Загрузка...</span>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>📁 Карты</h2>
                <span class="badge" id="mapsCount">0 карт</span>
            </div>

            <div style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="openUploadModal()">📤 Загрузить карту</button>
            </div>

            <div id="mapsList" class="list"></div>
        </div>
    </div>

    <!-- МОДАЛ ЗАГРУЗКИ КАРТЫ -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeUploadModal()">✕</button>
            <h2>📤 Загрузить карту</h2>

            <div class="form-group">
                <label>Файл карты (.json)</label>
                <input type="file" id="mapFileInput" accept=".json" onchange="onMapFileSelected(event)">
                <div class="hint">Название карты берётся из поля <code>mapName</code> внутри файла.</div>
            </div>

            <div class="form-group">
                <label>Название карты</label>
                <input id="mapNameInput" placeholder="Заполнится из файла" readonly>
            </div>

            <div class="form-group">
                <label>Доступность</label>
                <select id="mapPrivateInput">
                    <option value="false">🌐 Публичная (видна всем)</option>
                    <option value="true">🔒 Приватная (только по ID)</option>
                </select>
            </div>

            <div class="form-group">
                <label>О чём карта</label>
                <textarea id="mapDescInput" placeholder="Опишите карту: жанр, особенности, для какого режима..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" onclick="uploadMap()">Опубликовать</button>
                <button class="btn btn-outline" onclick="closeUploadModal()">Отмена</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // 1. КОНФИГ — URL API из GitHub
        // ============================================================
        const CONFIG_URL = 'https://raw.githubusercontent.com/MrYarost/StarLight/refs/heads/main/vortex-config/server.json';
        let API_URL = '';

        async function resolveApiUrl() {
            try {
                const res = await fetch(CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const cfg = await res.json();
                if (cfg && cfg.apiUrl) {
                    API_URL = cfg.apiUrl.replace(/\/+$/, '');
                    return true;
                }
                throw new Error('apiUrl отсутствует в конфиге');
            } catch (e) {
                console.warn('Не удалось получить конфиг:', e);
                return false;
            }
        }

        async function apiFetch(path, options = {}) {
            if (!API_URL) throw new Error('API URL не определён');
            const res = await fetch(API_URL + path, options);
            if (!res.ok) {
                let msg = 'HTTP ' + res.status;
                try { const j = await res.json(); if (j.error) msg = j.error; } catch (_) {}
                throw new Error(msg);
            }
            return res.json();
        }

        // ============================================================
        // 2. ДАННЫЕ
        // ============================================================
        let maps = [];
        let isLoading = false;
        let selectedFile = null;
        let selectedMapName = '';

        // ============================================================
        // 3. UI ПОМОЩНИКИ
        // ============================================================
        function setSyncStatus(text, type = 'loading') {
            const dot = document.getElementById('syncDot');
            const textEl = document.getElementById('syncText');
            dot.className = 'dot';
            if (type === 'loading') { dot.classList.add('syncing'); textEl.textContent = text || 'Загрузка...'; }
            else if (type === 'success') { dot.style.background = '#00b894'; textEl.textContent = text || 'Синхронизировано'; }
            else if (type === 'error') { dot.style.background = '#e74c3c'; textEl.textContent = text || 'Ошибка'; }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._hideTimeout);
            toast._hideTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============================================================
        // 4. ЗАГРУЗКА СПИСКА КАРТ
        // ============================================================
        async function loadFromApi() {
            if (isLoading) return;
            isLoading = true;
            setSyncStatus('Загрузка...', 'loading');
            try {
                if (!API_URL) {
                    const ok = await resolveApiUrl();
                    if (!ok) throw new Error('Не удалось получить URL API');
                }
                const resp = await apiFetch('/api/maps?sort=new');
                maps = resp.maps || [];
                renderMaps();
                setSyncStatus('Синхронизировано', 'success');
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                setSyncStatus('Ошибка загрузки', 'error');
                showToast('❌ ' + e.message, 'error');
                renderMaps();
            }
            isLoading = false;
        }

        // ============================================================
        // 5. РЕНДЕР СПИСКА
        // ============================================================
        function renderMaps() {
            const container = document.getElementById('mapsList');
            const count = document.getElementById('mapsCount');

            if (!maps.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>Нет загруженных карт</p>
                        <p style="font-size: 14px; color: #555;">Нажми «Загрузить карту» чтобы добавить</p>
                    </div>`;
                count.textContent = '0 карт';
                return;
            }

            count.textContent = maps.length + ' карт';

            container.innerHTML = maps.map((map) => `
                <div class="list-item">
                    <div class="info">
                        <div class="title">${escapeHtml(map.mapName)}</div>
                        <div class="details">
                            <span>🆔 ${map.id}</span>
                            <span>🔒 ${map.isPrivate ? 'Приватная' : 'Публичная'}</span>
                            <span>📥 ${map.downloads || 0}</span>
                        </div>
                        ${map.description ? `<div class="desc">${escapeHtml(map.description)}</div>` : ''}
                    </div>
                    <div class="actions">
                        <button class="btn btn-sm btn-primary" onclick="downloadMap('${map.id}')">📥 Скачать</button>
                        <button class="btn btn-sm btn-outline" onclick="copyMap('${map.id}')">📋 Копировать JSON</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        // ============================================================
        // 6. СКАЧИВАНИЕ / КОПИРОВАНИЕ
        // ============================================================
        async function fetchMapData(id) {
            const res = await fetch(API_URL + '/api/maps/' + id);
            if (!res.ok) throw new Error('Карта не найдена');
            const data = await res.json();
            return data.levelData || data;
        }

        async function downloadMap(id) {
            try {
                const jsonData = await fetchMapData(id);
                const json = JSON.stringify(jsonData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (maps.find(m => m.id === id)?.mapName || 'map') + '.json';
                a.click();
                URL.revokeObjectURL(url);
                await loadFromApi();
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        async function copyMap(id) {
            try {
                const jsonData = await fetchMapData(id);
                const json = JSON.stringify(jsonData, null, 2);
                navigator.clipboard.writeText(json).then(
                    () => showToast('✅ JSON скопирован!', 'success'),
                    () => {
                        const ta = document.createElement('textarea');
                        ta.value = json; document.body.appendChild(ta); ta.select();
                        document.execCommand('copy'); ta.remove();
                        showToast('✅ JSON скопирован!', 'success');
                    }
                );
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        // ============================================================
        // 7. МОДАЛ ЗАГРУЗКИ
        // ============================================================
        function openUploadModal() {
            selectedFile = null;
            selectedMapName = '';
            document.getElementById('mapFileInput').value = '';
            document.getElementById('mapNameInput').value = '';
            document.getElementById('mapDescInput').value = '';
            document.getElementById('mapPrivateInput').value = 'false';
            document.getElementById('uploadModal').classList.add('active');
        }
        function closeUploadModal() { document.getElementById('uploadModal').classList.remove('active'); }

        function onMapFileSelected(event) {
            const file = event.target.files[0];
            if (!file) { selectedFile = null; selectedMapName = ''; document.getElementById('mapNameInput').value = ''; return; }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.mapName) {
                        showToast('❌ В файле нет поля mapName', 'error');
                        selectedFile = null; selectedMapName = '';
                        document.getElementById('mapNameInput').value = '';
                        event.target.value = '';
                        return;
                    }
                    selectedFile = file;
                    selectedMapName = data.mapName;
                    document.getElementById('mapNameInput').value = data.mapName;
                } catch (err) {
                    showToast('❌ Неверный JSON: ' + err.message, 'error');
                    selectedFile = null; selectedMapName = '';
                    document.getElementById('mapNameInput').value = '';
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        async function uploadMap() {
            if (!selectedFile) { showToast('❌ Выберите файл .json', 'error'); return; }
            if (!selectedMapName) { showToast('❌ Название не найдено в файле', 'error'); return; }
            if (!API_URL) {
                const ok = await resolveApiUrl();
                if (!ok) { showToast('❌ Нет URL API', 'error'); return; }
            }

            const isPrivate = document.getElementById('mapPrivateInput').value;
            const description = document.getElementById('mapDescInput').value.trim();

            const fd = new FormData();
            fd.append('mapName', selectedMapName);
            fd.append('isPrivate', isPrivate);
            fd.append('description', description);
            fd.append('mapFile', selectedFile, selectedFile.name);

            try {
                const res = await fetch(API_URL + '/api/maps/upload', { method: 'POST', body: fd });
                if (!res.ok) {
                    const j = await res.json().catch(() => ({}));
                    throw new Error(j.error || 'HTTP ' + res.status);
                }
                closeUploadModal();
                await loadFromApi();
                showToast('✅ Карта "' + selectedMapName + '" загружена!', 'success');
            } catch (e) { showToast('❌ Ошибка: ' + e.message, 'error'); }
        }

        // ============================================================
        // 8. ЗАПУСК
        // ============================================================
        document.getElementById('uploadModal').addEventListener('click', function(e) {
            if (e.target === this) closeUploadModal();
        });
        loadFromApi();
    </script>
</body>
</html>
